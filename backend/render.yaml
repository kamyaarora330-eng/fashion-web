databases:
  - name: modera-postgres
    databaseName: modera_db
    user: modera_admin
    plan: free
    region: singapore # Closest to India for optimal latency
    ipAllowList: []

services:
  - type: web
    name: modera-backend
    env: node
    plan: free
    region: singapore
    buildCommand: "npm install && npx prisma generate && npx prisma migrate deploy"
    startCommand: "npm run start"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: modera-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://modera-fashion.modera-frontend.workers.dev
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
